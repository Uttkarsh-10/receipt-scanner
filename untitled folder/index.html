<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OCR Receipt Scanner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', Arial, sans-serif;
}

body{
    min-height:100vh;
    padding:40px;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #0f766e
        );

    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.container{
    width:100%;
    max-width:1100px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:24px;

    padding:35px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:white;
    font-size:2.5rem;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:rgba(255,255,255,0.7);
    margin-bottom:35px;
}

.upload-box{

    background:rgba(255,255,255,0.05);

    border:2px dashed rgba(255,255,255,0.2);

    border-radius:20px;

    padding:35px;

    text-align:center;

    transition:0.3s;
}

.upload-box:hover{

    transform:translateY(-4px);

    background:rgba(255,255,255,0.08);
}

.upload-box h3{
    color:white;
}

input[type=file]{

    margin-top:15px;

    color:white;
}

.chart-container{

    margin-top:25px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:25px;

    height:450px;
}

button{

    margin-top:20px;

    padding:14px 30px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #06b6d4
        );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 8px 25px rgba(16,185,129,0.4);
}

#loading{

    display:none;

    margin-top:25px;

    text-align:center;

    color:#a7f3d0;

    font-weight:bold;

    font-size:18px;
}

table{

    width:100%;

    margin-top:30px;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:18px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(10px);
}

th{

    padding:16px;

    background:rgba(255,255,255,0.1);

    color:white;

    text-align:left;
}

td{

    padding:16px;

    color:white;

    border-bottom:
        1px solid rgba(255,255,255,0.08);
}

tr{

    transition:0.2s;
}

tr:hover{

    background:
        rgba(255,255,255,0.08);
}

.analytics-section{

    margin-top:50px;
}

.analytics-section h2{

    color:white;

    margin-bottom:20px;
}

.analytics-card{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:18px;

    padding:18px;

    margin-bottom:18px;

    transition:0.3s;
}

.analytics-card:hover{

    transform:translateY(-4px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
}

.analytics-card p{

    color:white;

    margin:6px 0;
}

.footer{

    text-align:center;

    margin-top:35px;

    color:rgba(255,255,255,0.5);
}

.stats{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap:20px;

    margin-top:30px;
}

.stat-card{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);

    border-radius:18px;

    padding:25px;

    text-align:center;

    color:white;

    transition:0.3s;
}

.stat-card:hover{

    transform:translateY(-5px);
}

.stat-card h3{

    font-size:2rem;

    color:#34d399;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:25px;
    margin-top:40px;
}

.analytics-list{
    max-height:500px;
    overflow-y:auto;
    padding-right:10px;
}

.chart-container{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    height:500px;
}

.stat-card h3{
    font-size:3rem;
    font-weight:700;
    color:#22c55e;
}

@media(max-width:900px){
    .dashboard-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>📄 OCR Receipt Scanner</h1>

    <p class="subtitle">
        Upload a receipt and automatically classify purchased items
    </p>

    <div class="upload-box">

        <h3>Select Receipt Image</h3>

        <input type="file" id="imageInput">

        <br>

        <button onclick="scanReceipt()">
            Scan Receipt
        </button>

    </div>

    <div id="loading">
        🔍 Scanning Receipt...
    </div>

    <div id="result"></div>

<div class="stats">

    <div class="stat-card">
        <h3 id="merchantCount">0</h3>
        <p>Merchants</p>
    </div>

    <div class="stat-card">
        <h3 id="itemCount">0</h3>
        <p>Items Scanned</p>
    </div>

    <div class="stat-card">
        <h3 id="receiptCount">0</h3>
        <p>Receipts</p>
    </div>

</div>

<div class="dashboard-grid">

    <div class="analytics-section">

        <h2>📊 Monthly Analytics</h2>

        <div id="monthlyAnalytics" class="analytics-list">
            <p>No analytics available yet.</p>
        </div>

    </div>

    <div class="chart-container">

        <h2 style="color:white;margin-bottom:20px;">
            📈 Category Breakdown
        </h2>

        <canvas id="categoryChart"></canvas>

    </div>

</div>





<script>

async function loadMonthlyAnalytics(){

    try{

        const response = await fetch(
            "http://127.0.0.1:5000/monthly"
        );

        const data = await response.json();

        const container =
            document.getElementById("monthlyAnalytics");

        container.innerHTML = "";

        if(data.length === 0){

            container.innerHTML =
                "<p style='color:white'>No receipt data found.</p>";

            return;
        }

        // Stats cards
        document.getElementById("itemCount").innerText =
            data.reduce((sum,row)=>sum + row[3],0);

        document.getElementById("merchantCount").innerText =
            [...new Set(data.map(row => row[1]))].length;

        document.getElementById("receiptCount").innerText =
            data.length;

        // Analytics cards
        data.forEach(row => {

            container.innerHTML += `
                <div class="analytics-card">

                    <p><strong>📅 Month:</strong> ${row[0]}</p>

                    <p><strong>🏪 Merchant:</strong> ${row[1]}</p>

                    <p><strong>🍔 Item:</strong> ${row[2]}</p>

                    <p><strong>📦 Total Orders:</strong> ${row[3]}</p>

                </div>
            `;
        });

    }
    catch(error){

        console.error(error);
    }
}


let categoryChart = null;

async function loadCategoryChart(){

    const response =
        await fetch(
            "http://127.0.0.1:5000/category-summary"
        );

    const data =
        await response.json();

    const labels =
        data.map(row => row[0]);

    const values =
        data.map(row => row[1]);

    const ctx =
        document
        .getElementById("categoryChart")
        .getContext("2d");

    if(categoryChart){
        categoryChart.destroy();
    }

    categoryChart = new Chart(ctx, {

        type: "pie",

        data: {

            labels: labels,

            datasets: [{
                data: values
            }]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {
                    position: "bottom",
                    labels: {
                        color: "white",
                        font: {
                            size: 14
                        }
                    }
                }
            }
        }
    });
}

async function scanReceipt(){

    const file =
        document.getElementById("imageInput").files[0];

    if(!file){
        alert("Please upload a receipt image.");
        return;
    }

    document.getElementById("loading").style.display = "block";

    const formData = new FormData();

    formData.append("image", file);

    try{

        const response = await fetch(
            "http://127.0.0.1:5000/scan",
            {
                method:"POST",
                body:formData
            }
        );

        const data = await response.json();

        let html = `
        <table>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Confidence</th>
            </tr>
        `;

        data.forEach(item => {

            html += `
            <tr>
                <td>${item.text}</td>
                <td>${item.category}</td>
                <td>${item.confidence}</td>
            </tr>
            `;
        });

        html += `</table>`;

        document.getElementById("result").innerHTML = html;

        loadMonthlyAnalytics();
        loadCategoryChart();

    }
    catch(error){

        alert("Error connecting to Flask server.");

        console.error(error);
    }

    document.getElementById("loading").style.display = "none";
}


loadMonthlyAnalytics();
loadCategoryChart();

</script>

</body>
</html>
